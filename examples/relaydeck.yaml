# RelayDeck example configuration.
# Copy to relaydeck.yaml and edit. Run: relaydeck serve --config relaydeck.yaml
# Secrets can use ${ENV_VAR} expansion (e.g. ${RELAYDECK_API_KEY}).
listen_addr: :8080
data_dir: ./data
api_key: ${RELAYDECK_API_KEY}
workers: 4
max_payload_bytes: 1048576
retention_days: 30

# Local development only. Never enable in production unless you fully trust
# every destination you configure (SSRF protection is off for private IPs).
allow_private_destinations: false
# trusted_internal_destinations:
#   - internal-api.example.local

sources:
  - name: stripe
    secret: whsec_your_stripe_signing_secret
  - name: github
    secret: your_github_webhook_secret
  - name: shopify
    secret: your_shopify_webhook_secret

destinations:
  - name: laravel-api
    source: stripe
    url: https://api.example.com/webhooks/stripe
    method: POST
    timeout: 10s
    max_retries: 5
    backoff_base: 1s
    backoff_max: 60s
  - name: node-api
    source: github
    url: https://api.example.com/webhooks/github
    method: POST
    timeout: 10s
    max_retries: 5
    backoff_base: 1s
    backoff_max: 60s
  - name: nextjs-backend
    source: shopify
    url: https://app.example.com/api/webhooks/shopify
    method: POST
    headers:
      X-Webhook-Source: relaydeck
    max_retries: 5
