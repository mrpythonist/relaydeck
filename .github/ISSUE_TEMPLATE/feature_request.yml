name: Feature request
description: Suggest an idea for RelayDeck
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Good requests explain the problem first and the
        proposed change second. Check ROADMAP.md first; the idea may already
        be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer problem does this solve?
      placeholder: I cannot route only failed-payment events to my billing service; the substring filter is too coarse.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, in concrete terms?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why they fall short.
    validations:
      required: false
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: Check any area this change would touch.
      options:
        - label: Delivery semantics (at-least-once, retries, backoff)
        - label: Security (SSRF, auth, secrets)
        - label: Storage (SQLite schema, migrations)
        - label: Dashboard
        - label: CLI
        - label: Configuration
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else, such as prior art in other webhook gateways.
    validations:
      required: false
